# Exemple de configuration pour du SCALPING (bougies intraday, positions
# tenues quelques minutes à quelques heures maximum), à l'opposé du swing
# trading quotidien de config/config.yaml. À copier/adapter (ex:
# `cp config/config_scalping.example.yaml config/config_scalping.yaml`) puis
# utiliser avec `--config config/config_scalping.yaml` sur n'importe quelle
# commande (`backtest`, `optimize`, `walk-forward`, `paper`).
#
# ⚠️ Lire avant d'utiliser en réel :
#   - Les paramètres ci-dessous sont un POINT DE DÉPART, pas des valeurs
#     validées : lance `optimize` puis `walk-forward --optimize` avec cette
#     config avant d'y allouer le moindre capital, même en paper.
#   - `backtest.commission_pct` (5 bps) est calibré pour du swing quotidien :
#     en scalping réel, le spread bid-ask et le slippage à cette fréquence
#     coûtent généralement bien plus cher. Les résultats de backtest sont
#     probablement optimistes tant que ce paramètre n'est pas révisé à la
#     hausse pour refléter tes coûts réels observés en paper trading.
#   - Contrainte réglementaire (US) : un compte sur MARGE de moins de
#     25 000 $ qui effectue 4 day trades ou plus en 5 jours ouvrés est
#     classé "Pattern Day Trader" par le broker et se retrouve bloqué. Le
#     scalping en fait un usage intensif : vérifie l'equity de ton compte
#     avant de passer ceci en argent réel.

universe:
  # Titres nettement plus volatils que le SPY/QQQ/AAPL/MSFT/NVDA du bot
  # "swing" (config.yaml) : le scalping vise des mouvements petits et
  # fréquents, qui ont besoin d'une vraie volatilité intraday pour dépasser
  # les coûts de transaction. Vol annualisée approximative mesurée sur les
  # bougies 5 min (17 août -> 14 sept. 2026, à titre indicatif, ça bouge
  # dans le temps) : TSLA ~44%, AMD ~53%, SMCI ~71%, COIN ~73%, MSTR ~76%,
  # SOXL (ETF semiconducteurs à effet de levier x3) ~130% — à comparer aux
  # ~20-30% habituels de SPY/QQQ/AAPL/MSFT.
  symbols:
    - TSLA
    - AMD
    - SMCI
    - COIN
    - MSTR
    - SOXL

  # Granularité intraday : voir trading_bot.data.historical
  # (yfinance_interval_for_timeframe) et trading_bot.data.market_data
  # (_parse_timeframe) pour les valeurs supportées ('1Min', '5Min', '15Min',
  # '30Min', '1Hour', '1Day'). yfinance ne garantit qu'un historique limité
  # à cette granularité (~60 jours pour '5Min', 7 jours pour '1Min') :
  # ajuste `backtest.start_date` en conséquence.
  timeframe: "5Min"

strategies:
  # Seule stratégie pensée pour l'intraday : retour à la moyenne sur bandes
  # de Bollinger, entrées/sorties rapides (voir
  # trading_bot.strategies.bollinger_scalping). `window`/`num_std` sont les
  # deux paramètres à optimiser en priorité (voir `optimization.grids`
  # ci-dessous).
  - name: bollinger_scalping
    enabled: true
    weight: 1.0
    params:
      window: 20 # nombre de BOUGIES (pas de jours) : 20 * 5min = ~1h40
      num_std: 2.0
      min_band_width_pct: 0.0
    # Rotation périodique du sous-ensemble réellement tradé (voir
    # `UniverseRotationConfig` / `trading_bot.portfolio.universe_rotation`) :
    # plutôt que de rester indéfiniment sur les 6 titres fixes de
    # `universe.symbols` ci-dessus (qui peuvent devenir peu intéressants une
    # fois leur volatilité retombée), la stratégie choisit, parmi CE pool de
    # candidats, ceux dont la confiance (`min_confidence`) atteint le seuil —
    # un NOMBRE VARIABLE de titres selon les périodes, pas un compte fixe :
    # inutile de forcer une position sur un candidat médiocre juste pour
    # compléter un quota. `universe.symbols` reste utilisé pour la
    # récupération de prix/l'affichage, mais n'est PAS le pool tradé par
    # cette stratégie une fois la rotation active (voir
    # `SignalAllocator.__init__`) : d'où sa duplication ici.
    # ⚠️ Backtest/optimize/walk-forward uniquement pour l'instant : `paper`
    # refuse de démarrer tant qu'une stratégie a `universe_rotation.enabled`
    # (voir le garde-fou dans `trading_bot.cli.cmd_paper`) pour ne pas casser
    # la parité backtest/live en tradant silencieusement moins de titres
    # qu'en backtest.
    universe_rotation:
      enabled: true
      candidates:
        - TSLA
        - AMD
        - SMCI
        - COIN
        - MSTR
        - SOXL
        - NVDA
        - PLTR
        - RIVN
        - ARM
      metric: volatility # écart-type des rendements : cohérent avec le besoin d'amplitude du scalping/retour à la moyenne
      # Rang percentile moyen (sur `metric`, parmi les 10 candidats) requis
      # sur les `stability_window` dernières réévaluations pour être retenu.
      # 0.6 = il faut avoir été, en moyenne, dans la meilleure moitié
      # supérieure du pool de façon répétée (pas juste une fois par hasard).
      min_confidence: 0.6
      stability_window: 3 # moyenne sur les 3 dernières réévaluations
      lookback_window: 78 # ~1 séance de bougies 5min (78 * 5min ≈ 6h30, horaires NYSE)
      rebalance_every: 78 # réévalue le classement une fois par séance


  # Les stratégies suivantes ont été conçues et calibrées pour du swing
  # quotidien (config/config.yaml) : leurs fenêtres en "jours" n'ont plus le
  # même sens rapportées à des bougies 5 min. Désactivées ici par défaut ;
  # si tu veux les réactiver pour ce timeframe, retune complètement leurs
  # paramètres via `optimize` d'abord (ne te contente pas de diviser les
  # fenêtres par un facteur arbitraire).
  - name: sma_crossover
    enabled: false
    weight: 1.0
    params:
      fast_window: 20
      slow_window: 50

  - name: rsi_mean_reversion
    enabled: false
    weight: 1.0
    params:
      rsi_window: 14
      oversold: 30
      overbought: 70
      trend_filter_window: 200

  - name: momentum_breakout
    enabled: false
    weight: 1.0
    params:
      lookback_window: 55
      exit_window: 20

risk:
  allow_short: false
  max_gross_exposure_pct: 0.90
  max_position_weight_pct: 0.25
  # Réduit par rapport au 0.01 (1%) de config/config.yaml : l'univers
  # ci-dessus est ~2.5-4x plus volatil (vol annualisée ~44-130% contre
  # ~20-30% pour SPY/QQQ/AAPL/MSFT). Le dimensionnement par ATR (voir
  # `RiskManager.size_single`) réduit déjà le poids alloué à chaque symbole
  # proportionnellement à SON ATR propre, mais avec max_open_positions=5 sur
  # des titres aussi corrélés entre eux (tech/semis/crypto à beta élevé), un
  # jour de stress qui stoppe plusieurs positions à la fois peut cumuler un
  # risque bien supérieur à 1 x risk_per_trade_pct. Abaissé à 0.4% pour que
  # même 5 positions stoppées le même jour (~2% cumulé) restent sous
  # max_daily_loss_pct (3%), et laissent de la marge avant max_drawdown_pct
  # (20%, sticky : voir trading_bot.portfolio.circuit_breaker) sur une
  # séquence de plusieurs semaines difficiles.
  risk_per_trade_pct: 0.004
  # Resserré par rapport à 1.5 : limite la perte encaissée quand le poids
  # calculé par ATR est plafonné par max_position_weight_pct (auquel cas le
  # risque effectif au stop redevient proportionnel à atr_stop_multiple, pas
  # seulement à risk_per_trade_pct — voir la docstring de
  # `trading_bot.portfolio.risk`).
  atr_stop_multiple: 1.2
  atr_window: 14 # 14 bougies de 5min = ~70 minutes
  max_open_positions: 5
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.20

market:
  calendar: "NYSE"
  close_buffer_minutes: 15
  # Filtres de régime/volatilité désactivés dans cet exemple : calibrés à
  # l'origine sur des SMA de 200 JOURS, ce qui correspondrait ici à ~200
  # bougies de 5 min (~1000 minutes, ~2.4 séances) — une fenêtre bien plus
  # courte que ce pour quoi ils ont été pensés et validés. À retester
  # explicitement pour l'intraday avant de les réactiver ici.
  regime_filter:
    enabled: false
    symbol: "SPY"
    sma_window: 200
    bearish_exposure_scale: 0.3
    exempt_symbols: []
  volatility_filter:
    enabled: false
    symbol: "VIXY"
    sma_window: 20
    spike_threshold_pct: 0.15
    spike_exposure_scale: 0.5
    exempt_symbols: []

backtest:
  # À ajuster régulièrement : yfinance ne garantit des bougies 5 min que sur
  # les ~60 derniers jours glissants (voir le warning loggé par
  # `fetch_historical_data` si cette limite est dépassée).
  start_date: "2026-08-15"
  end_date: null
  initial_cash: 100000
  # ⚠️ Voir l'avertissement en tête de fichier : probablement optimiste pour
  # du scalping réel (spread/slippage non modélisés au-delà de ce %).
  commission_pct: 0.0005

live:
  # Un cycle par bougie plutôt que par heure (config/config.yaml) : le bot
  # doit réagir à chaque nouvelle bougie 5 min pour être cohérent avec la
  # stratégie de scalping.
  loop_interval_seconds: 300
  trade_only_when_market_open: true
  state_file: "state/live_state_scalping.json"

news_sentiment:
  enabled: false
  lookback_hours: 48
  block_threshold: -0.3
  min_articles: 2

# Grille de départ pour `optimize` / `walk-forward --optimize` sur les deux
# paramètres clés de bollinger_scalping. À valider par walk-forward avant
# toute allocation de capital (voir avertissement en tête de fichier).
optimization:
  metric: sharpe_ratio
  grids:
    bollinger_scalping:
      window: [10, 20, 30]
      num_std: [1.5, 2.0, 2.5]
