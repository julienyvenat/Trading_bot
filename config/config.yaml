# Configuration principale du bot de trading.
# Modifie ce fichier pour changer les symboles suivis, les stratégies actives
# et les paramètres de gestion du risque, sans toucher au code.

universe:
  # Actions / ETF suivis par le bot
  symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - NVDA

  # Granularité des bougies utilisées par les stratégies
  timeframe: "1Day"

# Stratégies actives et leur poids relatif dans l'allocation de capital.
# La somme des poids n'a pas besoin de faire 1 : ils sont normalisés automatiquement.
strategies:
  - name: sma_crossover
    enabled: true
    weight: 1.0
    params:
      fast_window: 20
      slow_window: 50

  - name: rsi_mean_reversion
    enabled: true
    weight: 1.0
    params:
      rsi_window: 14
      oversold: 30
      overbought: 70

  - name: momentum_breakout
    enabled: true
    weight: 1.0
    params:
      lookback_window: 55
      exit_window: 20

# Gestion du risque et du portefeuille
risk:
  # Autoriser les positions courtes (short). false = long-only, recommandé pour débuter.
  allow_short: false
  # Capital max engagé au total (en % de l'equity du compte)
  max_gross_exposure_pct: 0.90
  # Poids max d'une seule position (en % de l'equity)
  max_position_weight_pct: 0.25
  # Risque max par trade (en % de l'equity), utilisé pour dimensionner via l'ATR
  risk_per_trade_pct: 0.01
  # Multiple d'ATR utilisé comme distance de stop-loss
  atr_stop_multiple: 2.5
  atr_window: 14
  # Nombre max de positions simultanées, toutes stratégies confondues
  max_open_positions: 8

  # --- Coupe-circuits (kill switches) ---
  # Perte journalière max (% de l'equity en début de séance) avant de bloquer
  # toute NOUVELLE entrée pour le reste de la séance. Les positions déjà
  # ouvertes restent gérées normalement (stop suiveur toujours actif).
  # Se réinitialise automatiquement au début de chaque nouvelle séance.
  max_daily_loss_pct: 0.03
  # Drawdown max depuis le plus haut historique de l'equity avant de tout
  # liquider et d'arrêter complètement le trading (nouvelles entrées ET
  # positions existantes). Contrairement au coupe-circuit journalier, celui-ci
  # NE SE RÉINITIALISE PAS automatiquement : une fois déclenché, il faut
  # intervenir manuellement (voir README) avant que le bot ne retrade.
  max_drawdown_pct: 0.20

# Paramètres du calendrier de marché
market:
  # Calendrier boursier utilisé (jours fériés, horaires, fermetures anticipées).
  # Voir https://github.com/rsheftel/pandas_market_calendars pour la liste des
  # calendriers disponibles (NYSE couvre la quasi-totalité des actions/ETF US).
  calendar: "NYSE"
  # Ne pas ouvrir de NOUVELLE position dans les N dernières minutes avant la
  # clôture (évite l'auction de clôture et le slippage de fin de séance).
  # Les stops et sorties de positions existantes restent autorisés.
  close_buffer_minutes: 15

# Paramètres du backtest
backtest:
  start_date: "2018-01-01"
  end_date: null # null = aujourd'hui
  initial_cash: 100000
  commission_pct: 0.0005 # 5 bps par trade, approximation de frais + slippage

# Paramètres du moteur live (paper trading)
live:
  # Intervalle entre deux cycles de décision (en secondes). 3600 = toutes les heures.
  loop_interval_seconds: 3600
  # Ne trader que lorsque le marché US est ouvert, d'après le calendrier
  # (voir market: ci-dessus). Si false, ignore complètement les horaires de
  # marché (utile pour tester en dehors des heures de bourse).
  trade_only_when_market_open: true
  # Fichier utilisé pour persister l'état du bot entre deux redémarrages
  # (stops suiveurs en cours, état des coupe-circuits). Important : si le
  # coupe-circuit de drawdown a été déclenché, cet état est conservé même
  # après un redémarrage, par sécurité.
  state_file: "state/live_state.json"
