[project]
name = "trading-bot"
version = "0.1.0"
description = "Application de trading automatique multi-stratégies (actions/ETF, paper trading via Alpaca)"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.33.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "pandas-market-calendars>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
